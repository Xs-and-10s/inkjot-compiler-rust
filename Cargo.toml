[package]
name = "inkjot"
version = "0.5.0"
edition = "2021"
description = "Compiler for Inkjot, the Twee 3 dialect behind Inklinks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Xs-and-10s/inkjot-compiler-rust"

[workspace]
# The compiler and engine (this package) has no dependencies. The NIF that
# puts the engine inside the BEAM is its own crate, with Rustler.
members = [".", "native/inkjot_nif"]

[lib]
name = "inkjot"
path = "src/lib.rs"

[[bin]]
name = "inkjot"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 2
codegen-units = 16

[dev-dependencies]
# Property-based tests only. Nothing here is compiled into the `inkjot` binary.
proptest = { version = "1", default-features = false, features = ["std"] }
